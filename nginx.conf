# Serves the preview site. Pages are client-side routes (/components/button), so any path that
# isn't a file gets index.html. Built assets have hashed names and can be cached for good.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
